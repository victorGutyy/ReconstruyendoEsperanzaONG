<!doctype html>
<html lang="es-CO">
  <body style="margin:0;padding:24px;background:#f7f3ea;font-family:Arial,Helvetica,sans-serif;color:#1c2420">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#fffdf8;border:1px solid #d9d0bc;border-radius:6px">
      <tr>
        <td style="padding:28px 28px 8px">
          <p style="margin:0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#7a6224;font-weight:bold">Panel</p>
          <p style="margin:4px 0 0;font-family:Georgia,serif;font-size:22px;font-weight:bold;color:#173a2f">Reconstruyendo Esperanza</p>
        </td>
      </tr>
      <tr>
        <td style="padding:16px 28px 28px;font-size:16px;line-height:1.6">
          <p style="margin:0 0 16px">Recibimos una solicitud para restablecer la contraseña de tu cuenta del panel.</p>
          <p style="margin:0 0 24px">
            <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
               style="display:inline-block;background:#245745;color:#f7f3ea;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:4px">
              Crear una contraseña nueva
            </a>
          </p>
          <p style="margin:0 0 8px;font-size:14px;color:#4f5a53">El enlace sirve una sola vez y vence en 1 hora.</p>
          <p style="margin:0;font-size:14px;color:#4f5a53">Si no lo pediste, ignora este correo: tu contraseña no cambia.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
